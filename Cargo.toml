[package]
name = "larik-text"
version = "0.1.0"
edition = "2024"
description = "A native tabbed editor for text and code files"
license = "MIT"
repository = "https://github.com/fikrifirmanf/larik-text"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
encoding_rs = "0.8"
gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# Keep GPUI Component’s controls portable in development binaries too.
rust-embed = { version = "8", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
dirs = "4"
serde_json = "1"
semver = "1"
sha2 = "0.10"
reqwest = { package = "zed-reqwest", version = "=0.12.15-zed", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
similar = "2"
tempfile = "3"
thiserror = "2"
url = "2"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
# GPUI's zed-async-tar still uses xattr 0.2, which references a removed libc alias on Linux.
xattr = { path = "vendor/xattr" }

[build-dependencies]
# Embeds the app icon in the Windows executable.
winresource = "0.1"
